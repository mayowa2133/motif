<!doctype html><meta charset="utf-8"><title>Motif native review</title>
<style>body{margin:12px;background:#242830;color:#EEE5D3;font:14px system-ui}button,label{margin:0 9px 8px 0}#frame{position:relative;width:360px;height:640px}video{width:360px;height:640px;display:block}#mask{position:absolute;left:0;top:491px;width:360px;height:65px;background:#775340;display:none;pointer-events:none}</style>
<button id="rough">Play rough at 1×</button><button id="final">Play delivery at 1×</button><button id="pause">Pause</button><label><input type="checkbox" id="hide">Hide captions</label><p id="status">Ready</p><div id="frame"><video id="film" preload="auto" muted playsinline src="../renders/rough-mobile-01.mp4"></video><div id="mask"></div></div>
<script>const v=document.getElementById('film');function play(file){v.src=file;v.playbackRate=1;v.muted=true;v.currentTime=0;v.play()}document.getElementById('rough').onclick=()=>play('../renders/rough-mobile-01.mp4');document.getElementById('final').onclick=()=>play('../renders/mobile.mp4');document.getElementById('pause').onclick=()=>v.pause();document.getElementById('hide').onchange=e=>document.getElementById('mask').style.display=e.target.checked?'block':'none';v.ontimeupdate=()=>document.getElementById('status').textContent=(v.paused?'Paused':'Playing')+' '+v.currentTime.toFixed(2)+' / '+v.duration.toFixed(2)+' s · native 360 × 640 · muted';v.onended=()=>document.getElementById('status').textContent='Ended at '+v.currentTime.toFixed(3)+' s · 1× · muted';</script>
