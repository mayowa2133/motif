<!doctype html><html><head><meta charset="utf-8"><title>Motif fidelity v2 — native playback</title><style>body{margin:16px;background:#eee5d3;color:#211923;font:15px system-ui}video{display:block;width:360px;height:640px}button{padding:10px;margin-bottom:10px}#state{font-variant-numeric:tabular-nums}</style></head><body><h2>Fidelity v2 · 360 × 640 · REVIEW_REQUIRED</h2><button id="play">Play full film at 1× (muted)</button><button id="pause">Pause</button><video id="film" width="360" height="640" muted preload="auto" src="../renders/mobile.mp4"></video><p id="state">Ready</p><script>const v=document.getElementById('film'),s=document.getElementById('state');document.getElementById('play').onclick=()=>{v.currentTime=0;v.playbackRate=1;v.play()};document.getElementById('pause').onclick=()=>v.pause();v.ontimeupdate=()=>s.textContent=v.currentTime.toFixed(2)+' / '+v.duration.toFixed(2)+' sec';v.onended=()=>s.textContent+=' · ENDED';</script></body></html>
