<!doctype html><html><head><meta charset="UTF-8"><title>Motif moving preview</title><style>body{margin:0;background:#202C32;color:#F4EBD8;font:15px system-ui}main{display:flex;justify-content:center;gap:24px;padding:20px}video{width:360px;height:640px;background:#BDAE8F}section{width:360px}h1{font-size:21px}p{line-height:1.4}button,select{padding:7px;margin:3px;background:#F4EBD8;border:0;color:#202C32;font:13px system-ui}</style></head><body><main><section><video id="preview" controls preload="auto" src="../renders/mobile.mp4"></video></section><section><h1>Confidence Isn’t Evidence</h1><p>Native mobile · moving preview · REVIEW_REQUIRED</p><div><button id="initial" onclick="start('mobile-01.mp4')">Play initial muted 1×</button><button id="corrected" onclick="start('mobile.mp4')">Play corrected muted 1×</button><button id="pause" onclick="preview.pause()">Pause</button><button id="captions" onclick="preview.style.clipPath=preview.style.clipPath?'':'inset(0 0 98px 0)';this.textContent=preview.style.clipPath?'Restore captions':'Hide caption band'">Hide caption band</button><label for="moment">Inspect moment</label><select id="moment" onchange="preview.pause();preview.currentTime=Number(this.value)"><option value="0.4">Opening · 0.4 s</option><option value="1.8">Catch · 1.8 s</option><option value="5.8">Trace · 5.8 s</option><option value="9.6">Comparison · 9.6 s</option><option value="14.7">Gap · 14.7 s</option><option value="17">Decision · 17 s</option><option value="23">Payoff · 23 s</option></select></div><p id="status">Ready for story and staging review.</p><p>Final surfaces and audio polish await approval.</p></section></main><script>let log=[];const preview=document.getElementById('preview'),status=document.getElementById('status');function start(name){log=[];preview.src='../renders/'+name;preview.muted=true;preview.playbackRate=1;preview.play().catch(e=>status.textContent=e.message)}preview.ontimeupdate=()=>{status.textContent=`${preview.currentTime.toFixed(2)} / ${preview.duration.toFixed(2)} seconds · ${preview.paused?'paused':'playing'} · ${preview.playbackRate}×`;if(!log.length||preview.currentTime-log[log.length-1].time>=1)log.push({time:preview.currentTime,ended:preview.ended,width:preview.videoWidth,height:preview.videoHeight})};preview.onended=()=>{status.textContent='Playback complete';log.push({time:preview.currentTime,ended:preview.ended})};preview.onerror=()=>status.textContent='Media error '+preview.error.code;</script></body></html>
