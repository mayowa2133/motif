<!doctype html><html><head><meta charset="utf-8"><title>v4 encoded picture review</title><style>body{background:#211923;color:#EEE5D3;font:16px Arial}video{width:360px;height:640px}button{margin:6px;padding:10px}</style></head><body><video id="bare" controls muted src="picture-only-raw.mp4?pass=01"></video><p id="state">Native 360×640 / without captions / muted picture inspection</p><button onclick="playRange(0,76)">Opening at 1×</button><button onclick="playRange(248,328)">Basement at 1×</button><button onclick="playRange(455,507)">Menu at 1×</button><button onclick="playRange(507,559)">Audiobook at 1×</button><button onclick="playRange(937,986)">Ending at 1×</button><script>let end=986/30;function playRange(a,z){bare.pause();end=(z-.4)/30;bare.currentTime=a/30;bare.playbackRate=1;bare.play();state.textContent='Playing frames '+a+'–'+z+' at 1×'}function poll(){if(!bare.paused&&bare.currentTime>=end){bare.pause();state.textContent='Range finished at '+bare.currentTime.toFixed(2)+' seconds'}requestAnimationFrame(poll)}poll()</script></body></html>
