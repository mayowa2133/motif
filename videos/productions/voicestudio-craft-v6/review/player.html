<!doctype html><html><head><meta charset="utf-8"><title>VoiceStudio v6 review — 1×</title><style>
body{font:16px system-ui;background:#eee5d3;color:#211923;margin:18px}button{padding:9px;margin:3px;font:inherit}video{width:360px;height:640px;max-width:100%;display:block;background:#211923}section{display:flex;gap:16px;flex-wrap:wrap}h2{font-size:17px}#comparison{width:720px;height:auto}#status{white-space:pre-wrap;font:13px monospace}
</style></head><body><h1>VoiceStudio v6 — review at 1×</h1><button onclick="startFilms()">Play complete films at 1×</button><button onclick="pauseAll()">Pause</button><section><div><h2>v6 full export / phone-size display</h2><video id="full" controls preload="auto" muted src="../renders/moving-preview.mp4"></video></div><div><h2>v6 native 360 × 640</h2><video id="native" controls preload="auto" muted src="../renders/mobile.mp4"></video></div></section><h2>Matched v5 / v6 motion excerpts</h2><button onclick="compare('billing-and-relief')">Billing and relief at 1×</button><button onclick="compare('basement-completion')">Basement completion at 1×</button><button onclick="compare('keyboard-contact-rebound')">Keyboard at 1×</button><video id="comparison" controls muted preload="auto"></video><pre id="status"></pre><script>
const full=document.getElementById('full'),native=document.getElementById('native'),comparison=document.getElementById('comparison');const media=[full,native,comparison];let errors=[];
function status(){document.getElementById('status').textContent=JSON.stringify(media.map(v=>({id:v.id,time:Number(v.currentTime.toFixed(3)),duration:v.duration,ended:v.ended,paused:v.paused,rate:v.playbackRate,error:v.error?.message??null})),null,2)}
for(const v of media){v.addEventListener('timeupdate',status);v.addEventListener('ended',status);v.addEventListener('error',()=>{errors.push({id:v.id,code:v.error?.code});status()})}
function pauseAll(){media.forEach(v=>v.pause());status()}
function startFilms(){pauseAll();for(const v of [full,native]){v.currentTime=0;v.playbackRate=1;v.play()}status()}
function compare(name){pauseAll();comparison.src='../renders/comparisons/'+name+'.mp4';comparison.playbackRate=1;comparison.play();comparison.scrollIntoView({block:'center'});status()}
</script></body></html>
