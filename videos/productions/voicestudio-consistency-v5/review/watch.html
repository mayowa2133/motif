<!doctype html><html><head><meta charset="utf-8"><title>VoiceStudio v5 review</title><style>body{margin:0;background:#292b2d;color:#eee;font:16px system-ui}header{height:48px;display:flex;align-items:center;gap:18px;padding:0 20px}main{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}video{width:360px;height:640px;background:#111}label{display:block;margin:8px 0}</style></head><body><header>VoiceStudio v5 · 1×<button id="play">Play both</button><button id="pause">Pause both</button><span id="state">ready</span></header><main><section><label>Full encode displayed at phone size</label><video id="full" src="../renders/moving-preview.mp4" controls muted preload="auto"></video></section><section><label>Native 360×640 encode</label><video id="native" src="../renders/mobile.mp4" controls muted preload="auto"></video></section></main><script>const media=[document.querySelector('#full'),document.querySelector('#native')];document.querySelector('#play').onclick=()=>media.forEach(v=>{v.currentTime=0;v.playbackRate=1;v.play()});document.querySelector('#pause').onclick=()=>media.forEach(v=>v.pause());media.forEach(v=>{v.addEventListener('ended',()=>document.querySelector('#state').textContent='Finished '+media.map(x=>x.id+': '+x.currentTime.toFixed(3)+'s; errors '+(x.error?x.error.code:0)).join(' | '));v.addEventListener('error',()=>document.querySelector('#state').textContent='Media error '+v.id)});</script></body></html>
